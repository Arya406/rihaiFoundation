<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rihai Foundation - All Our Links</title>
    <meta name="description" content="Follow Rihai Foundation on Instagram, YouTube and X, and visit our website.">
    <link rel="canonical" href="https://www.rihaifoundation.com/links">
    <link rel="shortcut icon" type="image/x-icon" href="/images/logo/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary-color:#9F4D3B;
            --primary-dark:#7a3829;
            --bg-color:#F9F5F1;
            --text-color:#6A6765;
            --ink:#2b1a15;
            --font:"Stack Sans Headline", system-ui, sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            min-height:100vh;font-family:var(--font);color:var(--ink);
            background:
                radial-gradient(circle at 50% -10%, #f3dccd 0%, transparent 55%),
                var(--bg-color);
            display:flex;justify-content:center;padding:40px 20px 32px;
        }
        main{width:100%;max-width:440px;text-align:center}
        .logo{
            width:150px;height:150px;margin:0 auto 18px;border-radius:50%;
            background:#fff;overflow:hidden;padding:4px;
            box-shadow:0 10px 30px rgba(159,77,59,.18);
            display:grid;place-items:center;
        }
        .logo img{width:100%;height:100%;object-fit:contain;display:block}
        h1{font-size:26px;font-weight:700;color:var(--ink)}
        .tagline{font-size:15px;color:var(--primary-color);margin-top:4px;font-weight:500}
        .intro{color:var(--text-color);font-size:14px;margin:12px 0 28px;line-height:1.5}
        ul{list-style:none;display:flex;flex-direction:column;gap:14px}
        a.link{
            display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;
            background:#fff;color:var(--ink);text-decoration:none;
            border:1px solid rgba(159,77,59,.12);
            box-shadow:0 4px 14px rgba(43,26,21,.06);
            transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }
        a.link:hover,a.link:focus-visible{
            transform:translateY(-2px);border-color:var(--primary-color);
            box-shadow:0 10px 24px rgba(159,77,59,.18);outline:none;
        }
        .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
        .ic svg{width:24px;height:24px;fill:#fff}
        .txt{text-align:left;flex:1}
        .txt b{display:block;font-size:16px;font-weight:600}
        .txt small{color:var(--text-color);font-size:13px}
        .arrow{color:var(--primary-color);font-size:22px;line-height:1}
        .yt{background:#ff0000}
        .ig{background:linear-gradient(45deg,#f9a825,#e1306c 45%,#833ab4)}
        .x{background:#000}
        .web{background:var(--primary-color)}
        a.donate{
            display:block;margin-top:22px;padding:15px 18px;border-radius:16px;
            background:var(--primary-color);color:#fff;text-decoration:none;font-weight:600;font-size:16px;
            transition:background .15s ease;
        }
        a.donate:hover,a.donate:focus-visible{background:var(--primary-dark);outline:none}
        footer{color:var(--text-color);font-size:12px;margin-top:30px;opacity:.8}
    </style>
</head>
<body>

    <h1>Rihai Foundation</h1>

    <p class="intro">Follow our work and stay connected with us.</p>
